{% extends "base.html" %}

{% block content %}

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Room Management</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-4">

<input
class="form-control"
name="room_number"
placeholder="Room Number"
required>

</div>

<div class="col-md-4">

<input
type="number"
class="form-control"
name="capacity"
placeholder="Capacity"
required>

</div>

<div class="col-md-4">

<button class="btn btn-success w-100">

Add Room

</button>

</div>

</div>

</form>

<hr>

<table class="table table-hover">

<thead class="table-dark">

<tr>

<th>Room</th>

<th>Capacity</th>

<th>Occupied</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody>

{% for room in rooms %}

<tr>

<td>{{room.room_number}}</td>

<td>{{room.capacity}}</td>

<td>{{room.occupied}}</td>

<td>

<span class="badge bg-{% if room.status=='Available' %}success{% else %}danger{% endif %}">

{{room.status}}

</span>

</td>

<td>

<a
href="/room/delete/{{room.id}}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

{% endblock %}
